# Temporary Nginx configuration for SSL certificate generation
# Save this as ./nginx/conf.d/default.conf
# Use this FIRST to get SSL certificates, then switch to the full config

server {
    listen 80;
    server_name myoj.work.gd www.myoj.work.gd;
    server_tokens off;

    # Let's Encrypt ACME challenge - REQUIRED for certificate generation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporary: serve the app over HTTP until we get certificates
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect off;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files (if served by Nginx)
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media files (if served by Nginx)
    location /media/ {
        alias /var/www/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client max body size (for file uploads)
    client_max_body_size 100M;
}