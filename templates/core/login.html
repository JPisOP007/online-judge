{% extends 'core/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
  <div style="max-width: 420px; width: 100%; padding: 2.5rem; border: var(--border-w) solid var(--border); background: var(--surface); box-shadow: var(--shadow);">
    <h2 style="font-family: var(--font-heading); text-transform: uppercase; text-align: center; margin-bottom: 2rem; font-size: 1.75rem;">Log In</h2>

    <form method="post" style="display: flex; flex-direction: column;">
        {% csrf_token %}

        <label for="username" style="font-weight: 700; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; margin-bottom: 6px;">Username</label>
        <input type="text" name="username" id="username" required class="form-control" style="margin-bottom: 1.25rem;">

        <label for="password" style="font-weight: 700; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; margin-bottom: 6px;">Password</label>
        <input type="password" name="password" id="password" required class="form-control" style="margin-bottom: 1.5rem;">

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
            Log In
        </button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.95rem;">
        Don't have an account? <a href="{% url 'register' %}" style="font-weight: 700;">Register</a>
    </p>
  </div>
</div>
{% endblock %}
